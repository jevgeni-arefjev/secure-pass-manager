[workspace]
resolver = "3"
members = ["vault-core", "vault-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Argon2 is unusably slow unoptimised; keep it fast in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3
