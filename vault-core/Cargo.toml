[package]
name = "vault-core"
description = "Shared core: encryption, storage, audit log, backup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Cheap test formats (OWASP-minimum Argon2id, ADR-0005). Only this crate's own tests
# enable it, via the dev-dependency below; release builds refuse to compile with it.
insecure-test-kdf = []

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
region = { version = "4.0", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tempfile = "3.27"
tracing = { version = "0.1", default-features = false, features = ["std"] }
unicode-normalization = "0.1.26"
zeroize = { version = "1.9", features = ["derive", "serde"] }

[target."cfg(unix)".dependencies]
rlimit = "0.11"

[dev-dependencies]
vault-core = { path = ".", features = ["insecure-test-kdf"] }
rusqlite = "0.40"
