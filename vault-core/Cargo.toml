[package]
name = "vault-core"
description = "Shared core: encryption, storage, audit log, backup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
sha2 = "0.11.0"
zeroize = { version = "1.9", features = ["derive"] }
