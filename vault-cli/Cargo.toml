[package]
name = "vault-cli"
description = "Command-line front end for the password manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vault"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29"
rustyline = { version = "19", default-features = false }
unicode-width = "0.2"
vault-core = { path = "../vault-core" }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27"
vault-core = { path = "../vault-core", features = ["insecure-test-kdf"] }
