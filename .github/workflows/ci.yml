# Runs the same checks (.github/actions/checks) on every supported platform: macOS,
# Ubuntu, and Fedora in a container (GitHub has no Fedora runners).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
          - name: Ubuntu
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/checks

  fedora:
    name: Fedora
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # The image has no compiler; git lets checkout make a real clone, and tar, gzip
      # and xz unpack the toolchain, Node and the caches.
      - name: Build tools
        run: dnf install -y gcc git tar gzip xz
      - uses: actions/checkout@v5
      - uses: ./.github/actions/checks
