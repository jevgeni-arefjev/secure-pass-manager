# Builds and tests the workspace on macOS; type-checks, tests and builds the web
# client before the release build, which embeds it. Cargo steps never need Node.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Slow tests (production KDF)
        run: cargo test --locked -- --ignored
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Client (type-check, test, build)
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Release build
        run: cargo build --locked --release
